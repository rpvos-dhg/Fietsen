# fly.toml app configuration file generated for knooppuntroutes-cache on 2026-08-07T01:03:36+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'knooppuntroutes-cache'
primary_region = 'ams'

[build]
  dockerfile = 'cache-server/Dockerfile'

[env]
  CACHE_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'cache'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
